name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore
        run: nuget restore TVChannelsHacked.csproj

      - name: Build Release
        run: msbuild TVChannelsHacked.csproj /t:Build /p:Configuration=Release

      - name: Pack Release Zip
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { 'manual' }
          $outDir = "release"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $zipPath = Join-Path $outDir ("TVChannelsHacked-" + $version + ".zip")
          Compress-Archive -Path "bin/Release/net48/*" -DestinationPath $zipPath -Force
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVChannelsHacked-release
          path: ${{ env.ZIP_PATH }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
